services:
  postgres:
    image: postgres:16-alpine
    container_name: marco_db
    environment:
      POSTGRES_USER: marco
      POSTGRES_PASSWORD: marco
      POSTGRES_DB: marco_dev
    ports:
      - "5432:5432"
    volumes:
      - marco_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marco -d marco_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  marco_postgres_data:
